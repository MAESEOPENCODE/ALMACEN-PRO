<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b5c">
<title>Almacén</title>
<link rel="manifest" href="manifest.webmanifest" type="application/manifest+json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--hd:#1f3b5c;--bg:#eef1f4;--pn:#fff;--tx:#1d2733;--mu:#5d6b7a;--ln:#d3dae1;--ac:#2a7ab8;--sel:#dcebf7;--ok:#2f7d4f;--wr:#b26a00;--er:#b3261e;--th:#e6ebf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#12233a;--bg:#141a21;--pn:#1c242d;--tx:#e4e9ee;--mu:#93a1b0;--ln:#33404d;--ac:#5ba6dd;--sel:#25405a;--ok:#5cc08a;--wr:#e0a04a;--er:#f08a82;--th:#25303b}}
:root[data-theme="dark"]{--hd:#12233a;--bg:#141a21;--pn:#1c242d;--tx:#e4e9ee;--mu:#93a1b0;--ln:#33404d;--ac:#5ba6dd;--sel:#25405a;--ok:#5cc08a;--wr:#e0a04a;--er:#f08a82;--th:#25303b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
header b{font-size:17px;font-weight:600}header span{opacity:.7;font-size:13px}
header button{background:#fff;color:var(--hd);border:none;font-weight:600;padding:6px 14px;border-radius:3px;white-space:nowrap}
.wrap{display:flex;min-height:calc(100vh - 44px)}
nav{width:190px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:8px 0}
nav a{display:block;padding:9px 16px;color:var(--tx);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
nav a.on{background:var(--sel);border-left-color:var(--ac);font-weight:600}
main{flex:1;min-width:0;padding:14px 16px 40px}
h1{font-size:20px;font-weight:600;margin:0 0 8px}
.rb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--th);border:1px solid var(--ln);padding:6px 8px;margin-bottom:12px}
button{font:inherit;padding:6px 12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);cursor:pointer;border-radius:2px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
details{background:var(--pn);border:1px solid var(--ln);margin-bottom:12px}
summary{padding:8px 12px;font-weight:600;color:var(--ac);cursor:pointer}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 16px;padding:8px 12px 12px}
label{display:block;font-size:12.5px;color:var(--mu)}
input,select{display:block;width:100%;margin-top:2px;padding:6px 8px;font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:2px}
.sc{overflow-x:auto;background:var(--pn);border:1px solid var(--ln);margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--th);font-weight:600}td.n,th.n{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--sel)}
.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
.msg{padding:8px 12px;margin-bottom:12px;border:1px solid var(--ln);background:var(--pn)}
.msg.er{border-color:var(--er)}.msg.ok{border-color:var(--ok)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kp div{background:var(--pn);border:1px solid var(--ln);padding:10px 12px}.kp b{display:block;font-size:26px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{color:var(--mu);padding:12px}
@media(max-width:760px){.wrap{display:block}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:0}nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav a.on{border-bottom-color:var(--ac)}.cols{grid-template-columns:1fr}}
@media print{header,nav,.np{display:none!important}.wrap{display:block}body{background:#fff;color:#000}main{padding:0}}
</style>
</head>
<body>
<header><b>Almacén</b><span>Recepción, stock y trazabilidad</span><button id="ib" style="display:none;margin-left:auto" onclick="doInstall()">Instalar app</button></header>
<div id="iosb" style="display:none;background:#fff3cd;color:#664d03;padding:8px 14px;font-size:13px;text-align:center">Para instalarla en este iPhone/iPad: toca el icono de compartir (el cuadrado con la flecha hacia arriba) y luego "Añadir a pantalla de inicio".</div>
<div class="wrap"><nav id="nav"></nav><main id="m"></main></div>
<div id="scn" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9"><video id="vd" playsinline muted style="max-width:92%;max-height:70%"></video><button onclick="stopScan()">Cancelar</button></div>
<script>
var S,pg='inicio',flash=null,tr=null,sel={};
var today=new Date().toISOString().slice(0,10);
function load(){try{S=JSON.parse(localStorage.getItem('alm')||'null')}catch(e){S=null}
if(!S)S={items:[],led:[],blk:{},n:{REC:0,SAL:0,OP:0}};S.bom=S.bom||{};S.bomv=S.bomv||{};S.prov=S.prov||{};S.min=S.min||{};S.n.OP=S.n.OP||0;
if(!S.seeded&&!S.items.length){S.seeded=true;demo(true)}}
function save(){try{localStorage.setItem('alm',JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n,l){return String(n).padStart(l||4,'0')}
function num(q){return Number(q).toLocaleString('es-ES',{maximumFractionDigits:3})}
function fd(d){return d?d.split('-').reverse().join('/'):''}
function addD(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function item(id){return S.items.find(function(i){return i.id===id})||{id:id,d:id,u:''}}
function lines(){var m={},o=[];S.led.forEach(function(e){var k=e.it+'|'+e.lote+'|'+e.ub;if(!m[k]){m[k]={it:e.it,lote:e.lote,ub:e.ub,q:0,cad:'',prov:''};o.push(m[k])}
m[k].q+=e.q;if(e.cad)m[k].cad=e.cad;if(e.prov)m[k].prov=e.prov});return o.filter(function(l){return Math.abs(l.q)>1e-9})}
function est(l){if(S.blk[l.it+'|'+l.lote])return['Bloqueado','er'];if(l.cad&&l.cad<today)return['Caducado','er'];if(l.cad&&l.cad<=addD(30))return['Caduca pronto','wr'];return['Disponible','ok']}
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function go(p){pg=p;flash=null;if(p!=='art')sel.ea=null;draw()}
function say(t,k){flash={t:t,k:k};draw()}
var NAV=[['inicio','Inicio'],['art','Artículos'],['prv','Proveedores'],['rec','Recepción'],['sal','Salida'],['exp','Expedición'],['pro','Producción'],['inv','Inventario'],['mrp','Planificación'],['mov','Movimientos'],['stk','Stock'],['tra','Trazabilidad'],['ret','Retirada'],['doc','Documentos']];
function draw(){document.getElementById('nav').innerHTML=NAV.map(function(n){return'<a tabindex="0" class="'+(n[0]===pg?'on':'')+'" onclick="go(\''+n[0]+'\')" onkeydown="if(event.key===\'Enter\')go(\''+n[0]+'\')">'+n[1]+'</a>'}).join('');
var h=PG[pg]();document.getElementById('m').innerHTML=(flash?'<div class="msg '+flash.k+'">'+esc(flash.t)+'</div>':'')+h;if(pg==='sal')lotOpts();if(pg==='exp')xLots();if(pg==='art'&&sel.ea)fillItem()}
function opts(arr,cur){return arr.map(function(o){return'<option value="'+esc(o[0])+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}
function itemOpts(){return'<option value="">Elegir artículo…</option>'+opts(S.items.map(function(i){return[i.id,i.id+' – '+i.d]}))}
function empty(t){return'<div class="mt">'+t+'</div>'}
var PG={
inicio:function(){var L=lines().filter(function(l){return l.q>0}),ex=L.filter(function(l){return l.cad&&l.cad<today}),so=L.filter(function(l){return l.cad&&l.cad>=today&&l.cad<=addD(30)}),bl=L.filter(function(l){return S.blk[l.it+'|'+l.lote]});
var lst=L.filter(function(l){return est(l)[1]!=='ok'});
return'<h1>Inicio</h1><div class="rb"><button onclick="demo()">Cargar datos de ejemplo</button><button onclick="quitarDemo()">Quitar datos de ejemplo</button><button onclick="if(confirm(\'¿Borrar todos los datos?\')){localStorage.removeItem(\'alm\');load();go(\'inicio\')}">Borrar todo</button></div>'+
'<div class="kp"><div><b>'+S.items.length+'</b>Artículos</div><div><b>'+L.length+'</b>Líneas de stock</div><div><b class="wr">'+so.length+'</b>Caducan en 30 días</div><div><b class="er">'+(ex.length+bl.length)+'</b>Caducados o bloqueados</div></div>'+
alertas()+bkp()+'<h1>Lotes que requieren atención</h1>'+(lst.length?tbl(['Artículo','Lote','Ubicación','Cantidad','Caducidad','Estado'],lst.map(function(l){var e=est(l);return[item(l.it).d,l.lote,l.ub,num(l.q),fd(l.cad),'<span class="'+e[1]+'">'+e[0]+'</span>']}),[3]):'<div class="sc">'+empty('Nada que revisar.')+'</div>')},
art:function(){var st={};lines().forEach(function(l){st[l.it]=(st[l.it]||0)+l.q});
var tipos=S.items.map(function(i){return i.t}).filter(function(t,i,a){return t&&a.indexOf(t)===i});
return'<h1>Artículos</h1><details open><summary>Nuevo artículo</summary><div class="g"><label>Descripción<input id="a-d"></label><label>Tipo (materia prima, envase…)<input id="a-t" list="tps"></label><datalist id="tps">'+tipos.map(function(t){return'<option value="'+esc(t)+'">'}).join('')+'</datalist><label>Unidad de medida<input id="a-u" placeholder="kg, l, ud…"></label><label>Cód. seguimiento<select id="a-s"><option value="LOTE-CAD">Lote y caducidad</option><option value="LOTE">Solo lote</option><option value="NINGUNO">Sin seguimiento</option></select></label><label>Temperatura máxima °C (opcional)<input id="a-m" type="number" step="0.1"></label></div><div style="padding:0 12px 12px"><button class="p" id="a-b" onclick="addItem()">Guardar artículo</button></div></details>'+
(S.items.length?tbl(['Nº','Descripción','Tipo','UM','Seguimiento','Temp. máx.','Stock','Stock mínimo','Acción'],S.items.map(function(i){return[i.id,i.d,i.t,i.u,i.s,i.m===''?'':i.m+' °C',num(st[i.id]||0),'<input type="number" step="any" min="0" value="'+(S.min[i.id]==null?'':S.min[i.id])+'" onchange="setMin(\''+i.id+'\',this.value)" style="width:90px;margin:0">','<button onclick="editItem(\''+i.id+'\')">Editar</button> <button onclick="delItem(\''+i.id+'\')">Quitar</button>']}),[6]):'<div class="sc">'+empty('Aún no hay artículos. Crea el primero arriba.')+'</div>')},
rec:function(){var ub=lines().map(function(l){return l.ub}).concat(['Recepción','Cámara 1','Seco A']).filter(function(u,i,a){return a.indexOf(u)===i});
var pv=S.led.map(function(e){return e.prov}).concat(Object.keys(S.prov)).filter(function(p,i,a){return p&&p.indexOf('Producción')!==0&&a.indexOf(p)===i});
return'<h1>Recepción de compra</h1><div class="rb"><button class="p" onclick="saveRec()">Registrar recepción</button><span>Doc. siguiente: REC-'+pad(S.n.REC+1)+'</span></div>'+
'<details open><summary>General</summary><div class="g"><label>Artículo<select id="r-i">'+itemOpts()+'</select></label><label>Proveedor<input id="r-p" list="pvs"></label><datalist id="pvs">'+pv.map(function(p){return'<option value="'+esc(p)+'">'}).join('')+'</datalist><label>Ubicación<input id="r-u" list="ubs" value="Recepción"></label><datalist id="ubs">'+ub.map(function(u){return'<option value="'+esc(u)+'">'}).join('')+'</datalist></div></details>'+
'<details open><summary>Seguimiento de artículo</summary><div class="g"><label>Nº lote<input id="r-l"><button type="button" onclick="scan(fillLot)" style="margin-top:4px">Escanear</button></label><label>Cantidad<input id="r-q" type="number" step="any" min="0"></label><label>Fecha de caducidad<input id="r-c" type="date"></label><label>Temperatura de llegada °C<input id="r-t" type="number" step="0.1"></label></div></details>'},
sal:function(){return'<h1>Salida de almacén</h1><div class="rb"><button class="p" onclick="saveSal()">Registrar salida</button><span>Doc. siguiente: SAL-'+pad(S.n.SAL+1)+'</span></div>'+
'<details open><summary>General</summary><div class="g"><label>Artículo<select id="s-i" onchange="lotOpts()">'+itemOpts()+'</select></label><label>Tipo de salida<select id="s-t"><option>Consumo producción</option><option>Venta</option><option>Merma</option></select></label><label>Cliente o destino<input id="s-d"></label></div></details>'+
'<details open><summary>Lote (primero el que caduca antes)</summary><div class="g"><label>Lote y ubicación<select id="s-l"></select><button type="button" onclick="scan(pickLot)" style="margin-top:4px">Escanear lote</button> <span id="sm"></span></label><label>Cantidad<input id="s-q" type="number" step="any" min="0"></label></div></details>'},
pro:function(){var p=sel.pi||'';
var h='<h1>Producción</h1><details open><summary>Producto terminado</summary><div class="g"><label>Artículo<select id="p-i" onchange="sel.pi=this.value;draw()">'+itemOpts().replace('value="'+p+'"','value="'+p+'" selected')+'</select></label></div></details>';
if(!p)return h+'<div class="sc">'+empty('Elige el producto que vas a fabricar.')+'</div>'+ordList();
var V=boms(p).slice().reverse(),dv=devVer(p),cv=certVer(p);
h+='<h1>Versiones de la receta</h1>'+(V.length?tbl(['Versión','Estado','Base','Componentes'],V.map(function(x){return['v'+x.ver,'<span class="'+(x.est==='Certificada'?'ok':x.est==='En desarrollo'?'wr':'')+'">'+x.est+'</span>',num(x.base)+' '+esc(item(p).u),x.comps.length]})):'<div class="sc">'+empty('Sin recetas todavía.')+'</div>');
h+='<div class="rb">'+(dv?'':'<button onclick="newVer(\''+p+'\')">Nueva versión</button>')+(dv?'<button class="p" onclick="certifyVer(\''+p+'\')">Certificar versión '+dv.ver+'</button>':'')+'</div>';
if(dv){var ed=dv;h+='<details open><summary>Editando versión '+ed.ver+' (para '+num(ed.base)+' '+esc(item(p).u)+')</summary>'+(ed.comps.length?tbl(['Componente','Cantidad','Merma','Acción'],ed.comps.map(function(c,i){return[item(c.it).d,num(c.q)+' '+item(c.it).u,num(c.m||0)+' %','<button onclick="delC('+i+')">Quitar</button>']}),[1,2]):empty('Sin componentes.'))+'<div class="g"><label>Cantidad base de la receta<input type="number" step="any" min="0" value="'+ed.base+'" onchange="setBase(\''+p+'\',this.value)"></label><label>Componente<select id="b-i">'+itemOpts()+'</select></label><label>Cantidad en la receta<input id="b-q" type="number" step="any" min="0"></label><label>Merma %<input id="b-m" type="number" step="any" min="0" value="0"></label></div><div style="padding:0 12px 12px"><button onclick="addC()">Añadir componente</button></div>'+
'<div class="g"><label>Centro de trabajo<input value="'+esc(ed.centro||'')+'" onchange="setVerField(\''+p+'\',\'centro\',this.value)"></label><label>Tiempo de preparación (min)<input type="number" step="any" min="0" value="'+(ed.prep||0)+'" onchange="setVerField(\''+p+'\',\'prep\',this.value)"></label><label>Minutos por '+esc(item(p).u)+'<input type="number" step="any" min="0" value="'+(ed.perU||0)+'" onchange="setVerField(\''+p+'\',\'perU\',this.value)"></label></div></details>'}
else if(cv)h+='<div class="sc">'+empty('Versión '+cv.ver+' certificada, con '+cv.comps.length+' componentes. "Nueva versión" para modificarla sin afectar a las órdenes en curso.')+'</div>';
if(!cv)return h+'<div class="sc">'+empty('Certifica una receta antes de crear órdenes de este producto.')+'</div>'+ordList();
return h+'<details open><summary>Orden de producción (receta certificada v'+cv.ver+')</summary><div class="g"><label>Cantidad a producir<input id="p-q" type="number" step="any" min="0" oninput="needs()"></label><label>Nº lote producto terminado<input id="p-l"></label><label>Fecha de caducidad<input id="p-c" type="date"></label><label>Ubicación<input id="p-u" value="Cámara 1"></label></div><div id="nd"></div><div style="padding:0 12px 12px"><button class="p" onclick="createOrd()">Crear orden</button> <span>El stock no se mueve hasta que termines la orden.</span></div></details>'+ordList()},
inv:function(){var L=invLines();if(!L.length)return'<h1>Inventario físico</h1><div class="sc">'+empty('No hay stock que contar.')+'</div>';
return'<h1>Inventario físico</h1><div class="rb"><button class="p" onclick="saveInv()">Registrar ajustes</button><span>Deja vacío lo que no cuentes. Doc. siguiente: INV-'+pad((S.n.INV||0)+1)+'</span></div>'+tbl(['Artículo','Lote','Ubicación','En sistema','Contado','Diferencia'],L.map(function(l,i){return[item(l.it).d,l.lote,l.ub,num(l.q),'<input id="c'+i+'" type="number" step="any" min="0" oninput="difc('+i+')" style="width:110px;margin:0">','<span id="d'+i+'"></span>']}),[3])},
ret:function(){var ks=[];S.led.forEach(function(e){var k=e.it+'|'+e.lote;if(e.lote&&ks.indexOf(k)<0)ks.push(k)});var k=sel.rk||'';
var o='<h1>Retirada de producto</h1><div class="rb np"><label style="width:320px">Lote afectado<select onchange="sel.rk=this.value;draw()"><option value="">Elegir lote…</option>'+opts(ks.map(function(x){var p=x.split('|');return[x,item(p[0]).d+' – '+p.slice(1).join('|')]}),k)+'</select></label>'+(k?'<button class="p" onclick="blkAll()">Bloquear lotes afectados</button><button onclick="window.print()">Imprimir informe</button>':'')+'</div>';
if(!k)return o+'<div class="sc">'+empty('Elige el lote con problema para ver qué lotes y clientes están afectados.')+'</div>';
var A=afect(k),p=k.split('|'),src=S.led.filter(function(e){return e.it===p[0]&&e.lote===p.slice(1).join('|')&&e.q>0})[0]||{},L=lines();
var V=S.led.filter(function(e){return e.q<0&&e.t==='Venta'&&A.indexOf(e.it+'|'+e.lote)>-1});
return o+'<p>Informe de retirada del '+fd(today)+'. Lote origen: <b>'+esc(item(p[0]).d)+' – '+esc(p.slice(1).join('|'))+'</b>'+(src.prov?', proveedor '+esc(src.prov):'')+(src.cad?', caducidad '+fd(src.cad):'')+'.</p>'+prvBox(src.prov)+'<h1>Lotes afectados</h1>'+
tbl(['Artículo','Lote','Relación','Stock en almacén','Estado'],A.map(function(x){var q=x.split('|'),lo=q.slice(1).join('|'),s=L.filter(function(l){return l.it===q[0]&&l.lote===lo}).reduce(function(t,l){return t+l.q},0);return[item(q[0]).d,lo,x===k?'Lote origen':'Producido con el lote origen',num(s),'<span class="'+(S.blk[x]?'er':'wr')+'">'+(S.blk[x]?'Bloqueado':'Sin bloquear')+'</span>']}),[3])+
'<h1>Clientes afectados</h1>'+(V.length?tbl(['Fecha','Doc.','Cliente o destino','Artículo','Lote','Cantidad'],V.map(function(e){return[fd(e.f),e.doc,e.dest,item(e.it).d,e.lote,num(-e.q)]}),[5]):'<div class="sc">'+empty('Ninguno de estos lotes se ha vendido.')+'</div>')},
prv:function(){var N=Object.keys(S.prov).sort();
return'<h1>Proveedores</h1><details open><summary>Nuevo o modificar proveedor</summary><div class="g"><label>Nombre<input id="v-n"></label><label>Persona de contacto<input id="v-c"></label><label>Teléfono<input id="v-t" type="tel"></label><label>Correo<input id="v-e" type="email"></label></div><div style="padding:0 12px 12px"><button class="p" onclick="addPrv()">Guardar proveedor</button></div></details>'+(N.length?tbl(['Nombre','Contacto','Teléfono','Correo','Acción'],N.map(function(n){var p=S.prov[n];return[n,p.c,p.t,p.e,'<button onclick="delPrv(\''+esc(n)+'\')">Quitar</button>']}),[]):'<div class="sc">'+empty('Aún no hay proveedores.')+'</div>')},
doc:function(){var D=[];S.led.forEach(function(e){if(D.indexOf(e.doc)<0)D.push(e.doc)});D.reverse();var d=sel.dc||'';

navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){st=s;var vd=document.getElementById('vd');vd.srcObject=s;vd.play();document.getElementById('scn').style.display='flex';var bd=new BarcodeDetector();
(function lp(){if(!st)return;bd.detect(vd).then(function(r){if(r.length){var t=r[0].rawValue;stopScan();cb(t)}else setTimeout(lp,250)}).catch(function(){setTimeout(lp,250)})})()}).catch(function(){say('No se pudo abrir la cámara. Revisa los permisos.','er')})}
function stopScan(){if(st){st.getTracks().forEach(function(t){t.stop()});st=null}document.getElementById('scn').style.display='none'}
function fillLot(t){document.getElementById('r-l').value=t}
function pickLot(t){var el=document.getElementById('s-l'),sm=document.getElementById('sm'),o=Array.prototype.filter.call(el.options,function(x){return x.value.indexOf(t+'|')===0})[0];
if(o){el.value=o.value;sm.textContent='Lote '+t+' seleccionado.'}else sm.textContent='Lote '+t+' no disponible para este artículo.'}
function goLot(t){var e=S.led.filter(function(x){return x.lote===t})[0];if(!e)return say('Lote '+t+' no encontrado.','er');tr=e.it+'|'+t;draw()}
function invLines(){return lines().filter(function(l){return l.q>0}).sort(function(a,b){return(item(a.it).d+a.lote).localeCompare(item(b.it).d+b.lote)})}
function difc(i){var l=invLines()[i],x=document.getElementById('c'+i).value,s=document.getElementById('d'+i);if(x===''){s.textContent='';return}var d=parseFloat(x)-l.q;s.textContent=(d>0?'+':'')+num(d);s.className=Math.abs(d)<1e-9?'ok':'er'}
function saveInv(){var ch=[];invLines().forEach(function(l,i){var x=document.getElementById('c'+i).value;if(x!==''&&Math.abs(parseFloat(x)-l.q)>1e-9)ch.push([l,parseFloat(x)-l.q])});
if(!ch.length)return say('No hay diferencias que ajustar.','ok');var doc='INV-'+pad(S.n.INV=(S.n.INV||0)+1);
ch.forEach(function(c){S.led.push({n:S.led.length+1,f:today,t:'Ajuste',doc:doc,it:c[0].it,lote:c[0].lote,q:c[1],ub:c[0].ub,dest:'Inventario físico'})});save();say(doc+' registrado con '+ch.length+' ajustes.','ok')}
function afect(k,seen){seen=seen||[];if(seen.indexOf(k)>-1)return seen;seen.push(k);var p=k.split('|'),it=p[0],lo=p.slice(1).join('|');
S.led.forEach(function(e){if(e.it===it&&e.lote===lo&&e.q<0&&e.op)S.led.forEach(function(o){if(o.op===e.op&&o.t==='Producción')afect(o.it+'|'+o.lote,seen)})});return seen}
function blkAll(){afect(sel.rk).forEach(function(x){S.blk[x]=true});save();say('Lotes afectados bloqueados.','ok')}
function addPrv(){var n=v('v-n');if(!n)return say('Indica el nombre del proveedor.','er');S.prov[n]={c:v('v-c'),t:v('v-t'),e:v('v-e')};save();say('Proveedor guardado.','ok')}
function delPrv(n){delete S.prov[n];save();draw()}
function setMin(id,x){if(x==='')delete S.min[id];else S.min[id]=parseFloat(x);save()}
function prvBox(n){var p=S.prov[n];if(!n)return'';if(!p)return'<p>No hay datos de contacto de '+esc(n)+'. Añádelos en Proveedores.</p>';
return'<p>Contacto del proveedor: '+[p.c,p.t].filter(Boolean).map(esc).join(', ')+(p.e?(p.c||p.t?', ':'')+'<a href="mailto:'+esc(p.e)+'?subject='+encodeURIComponent('Retirada de lote')+'">'+esc(p.e)+'</a>':'')+'.</p>'}
function alertas(){var t={};lines().forEach(function(l){if(l.q>0&&est(l)[1]!=='er')t[l.it]=(t[l.it]||0)+l.q});
var R=S.items.filter(function(i){return S.min[i.id]!=null&&(t[i.id]||0)<S.min[i.id]});
return'<h1>Stock bajo mínimo</h1>'+(R.length?tbl(['Artículo','Disponible','Mínimo','Falta'],R.map(function(i){var d=t[i.id]||0;return[i.d,num(d)+' '+i.u,num(S.min[i.id])+' '+i.u,'<span class="er">'+num(S.min[i.id]-d)+' '+esc(i.u)+'</span>']}),[1,2,3]):'<div class="sc">'+empty('Ningún artículo por debajo de su mínimo. Define mínimos en Artículos. No cuenta el stock bloqueado ni caducado.')+'</div>')}
function cadOf(e){var x=S.led.filter(function(y){return y.it===e.it&&y.lote===e.lote&&y.cad})[0];return x?x.cad:''}
function openDoc(d){sel.dc=d;go('doc')}
function reserved(c,C){return C.filter(function(x){return x.it===c.it&&x.lote===c.lote&&x.ub===c.ub}).reduce(function(s,x){return s+x.q},0)}
function xLots(){var el=document.getElementById('x-l');if(!el)return;var id=v('x-i'),C=sel.cart||[];
var L=lines().filter(function(l){return l.it===id&&l.q>0&&est(l)[1]!=='er'}).map(function(l){return{lote:l.lote,ub:l.ub,cad:l.cad,q:l.q-reserved(l,C)}}).filter(function(l){return l.q>1e-9}).sort(function(a,b){return(a.cad||'9999').localeCompare(b.cad||'9999')});
el.innerHTML=L.length?opts(L.map(function(l){return[l.lote+'|'+l.ub,(l.lote||'sin lote')+' · '+l.ub+' · '+num(l.q)+' disp.'+(l.cad?' · cad. '+fd(l.cad):'')]})):'<option value="">Sin lotes disponibles</option>'}
function addX(){var id=v('x-i'),k=v('x-l'),q=parseFloat(v('x-q')),C=sel.cart=sel.cart||[];sel.xc=v('x-c');sel.xi=id;
if(!id||!k)return say('Elige artículo y lote disponible.','er');if(!(q>0))return say('La cantidad debe ser mayor que cero.','er');
var i=k.lastIndexOf('|'),lote=k.slice(0,i),ub=k.slice(i+1),l=lines().filter(function(x){return x.it===id&&x.lote===lote&&x.ub===ub})[0];
if(!l||q>l.q-reserved({it:id,lote:lote,ub:ub},C)+1e-9)return say('No hay stock suficiente en ese lote.','er');
C.push({it:id,lote:lote,ub:ub,q:q});draw()}
function delX(i){sel.cart.splice(i,1);sel.xc=v('x-c');draw()}
function saveExp(){var c=v('x-c'),C=sel.cart||[];sel.xc=c;if(!c)return say('Indica el cliente o destino.','er');if(!C.length)return say('Añade al menos una línea.','er');
var doc='EXP-'+pad(S.n.EXP=(S.n.EXP||0)+1);C.forEach(function(x){S.led.push({n:S.led.length+1,f:today,t:'Venta',doc:doc,it:x.it,lote:x.lote,q:-x.q,ub:x.ub,dest:c})});
sel.cart=[];sel.xc='';sel.dc=doc;save();pg='doc';say(doc+' registrada con '+C.length+' líneas. Esta es su hoja para imprimir.','ok')}
function needs(){var el=document.getElementById('nd');if(!el)return;var q=parseFloat(v('p-q')),cv=certVer(sel.pi),bm=cv?cv.comps:[],base=cv?cv.base:1;if(!(q>0)||!bm.length){el.innerHTML='';return}
var t={};lines().forEach(function(l){if(l.q>0&&est(l)[1]!=='er')t[l.it]=(t[l.it]||0)+l.q});
el.innerHTML=tbl(['Componente','Necesario','Disponible','Situación'],bm.map(function(c){var n=c.q*(1+(c.m||0)/100)*q/base,d=t[c.it]||0;return[item(c.it).d,num(n)+' '+item(c.it).u,num(d)+' '+item(c.it).u,d+1e-9>=n?'<span class="ok">Cubierto</span>':'<span class="er">Faltan '+num(n-d)+' '+esc(item(c.it).u)+'</span>']}),[1,2])}
function editItem(id){sel.ea=id;draw();window.scrollTo(0,0)}
function fillItem(){var i=item(sel.ea);document.getElementById('a-d').value=i.d;document.getElementById('a-t').value=i.t||'';document.getElementById('a-u').value=i.u;document.getElementById('a-s').value=i.s;document.getElementById('a-m').value=i.m===undefined?'':i.m;
var b=document.getElementById('a-b');b.textContent='Guardar cambios de '+i.id;b.insertAdjacentHTML('afterend',' <button onclick="sel.ea=null;draw()">Cancelar</button>')}
function delItem(id){if(S.led.some(function(e){return e.it===id}))return say('No se puede quitar un artículo con movimientos.','er');
if(Object.keys(S.bomv||{}).some(function(p){return p===id||S.bomv[p].some(function(x){return x.comps.some(function(c){return c.it===id})})}))return say('No se puede quitar: forma parte de una lista de materiales.','er');
if(!confirm('¿Quitar el artículo '+id+'?'))return;S.items=S.items.filter(function(i){return i.id!==id});delete S.min[id];save();say('Artículo quitado.','ok')}
function bs(p){return(S.base&&S.base[p])||1}
function setBase(p,x){x=parseFloat(x);var d=devVer(p);if(d&&x>0){d.base=x;save()}draw()}
function ords(){return S.ord=S.ord||[]}
function ordList(){var O=ords().slice().reverse();return'<h1>Órdenes de producción</h1>'+(O.length?tbl(['Orden','Producto','Cantidad','Lote','Centro','Duración est.','Estado','Acción'],O.map(function(o){var i=ords().indexOf(o),b=o.est==='Terminada'?'<button onclick="openDoc(\''+o.n+'\')">Hoja</button>':(o.est==='Planificada'?'<button onclick="launchOrd('+i+')">Lanzar</button> ':'<button onclick="saveOp(ords()['+i+'])">Terminar</button> ')+'<button onclick="delOrd('+i+')">Anular</button>';
return[o.n,item(o.it).d,num(o.q)+' '+item(o.it).u,o.lote,o.centro||'',o.dur?num(o.dur)+' min':'','<span class="'+(o.est==='Terminada'?'ok':o.est==='Lanzada'?'wr':'')+'">'+o.est+'</span>',b]}),[2,5]):'<div class="sc">'+empty('Sin órdenes. Crea la primera arriba.')+'</div>')}
function createOrd(){var p=sel.pi,it=item(p),cv=certVer(p),q=parseFloat(v('p-q')),l=v('p-l'),c=v('p-c'),u=v('p-u');
if(!cv)return say('Certifica antes una receta para este producto.','er');if(!(q>0))return say('La cantidad debe ser mayor que cero.','er');if(!u)return say('Indica la ubicación.','er');
if(it.s!=='NINGUNO'&&!l)return say('Este artículo exige nº de lote.','er');if(it.s==='LOTE-CAD'&&!c)return say('Este artículo exige fecha de caducidad.','er');
var n='OP-'+pad(++S.n.OP),dur=(cv.prep||0)+(cv.perU||0)*q;ords().push({n:n,it:p,q:q,lote:l,cad:c,ub:u,ver:cv.ver,centro:cv.centro||'',dur:dur,est:'Planificada'});save();say(n+' creada en estado Planificada, con la receta v'+cv.ver+'.','ok')}
function launchOrd(i){var o=ords()[i],cv=certVer(o.it);if(!cv)return say('Este producto ya no tiene receta certificada.','er');
for(var k=0;k<cv.comps.length;k++){if(!pick(cv.comps[k].it,cv.comps[k].q*(1+(cv.comps[k].m||0)/100)*o.q/cv.base))return say('No hay stock disponible suficiente de '+item(cv.comps[k].it).d+'.','er')}
o.est='Lanzada';save();say(o.n+' lanzada: hay stock de todos los componentes. El stock no queda reservado hasta terminarla.','ok')}
function delOrd(i){var o=ords()[i];if(o.est==='Terminada')return say('Una orden terminada no se puede anular.','er');if(!confirm('¿Anular la orden '+o.n+'?'))return;ords().splice(i,1);save();draw()}
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;var b=document.getElementById('ib');if(b)b.style.display='inline-block'});
window.addEventListener('appinstalled',function(){var b=document.getElementById('ib');if(b)b.style.display='none';deferredPrompt=null});
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;document.getElementById('ib').style.display='none'})}
(function(){var ua=navigator.userAgent||'';var iOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
if(iOS&&!standalone){var el=document.getElementById('iosb');if(el)el.style.display='block'}})();
load();draw();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
